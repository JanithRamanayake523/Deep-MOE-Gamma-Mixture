# Default training configuration for the Deep-MoE gamma-mixture estimator.
# Mirrors RESEARCH_METHODOLOGY.md sections 5.4-5.5.
seed: 123

simulation:
  k: 2                      # dimension of the multivariate gamma (train one net per k)
  g_min: 1                  # sample g uniformly from {g_min, ..., g_max} (unknown-g training)
  g_max: 4
  alpha_range: [0.1, 30.0]  # LogUniform; covers singular alpha<1 and near-Gaussian regimes
  beta_range: [0.1, 30.0]   # LogUniform (scale parameterisation; mean = alpha * beta)
  dirichlet_concentration: 1.0
  n_min: 25
  n_max: 5000
  overlap_stratification: true   # stratify draws by Bayes-error overlap bin
  overlap_bins: [[0.0, 0.05], [0.05, 0.20], [0.20, 0.50]]   # low / medium / high

model:
  enc_hidden: 128
  enc_layers: 3
  enc_out: 128
  pooling: mean             # DeepSets pooling: mean | sum | meansum
  use_wh_features: true     # augment inputs with z^(1/3) (Wilson-Hilferty) and log z
  use_summary_stats: true   # fuse classical summary statistics into the embedding
  head_hidden: 128
  head_layers: 2
  use_g_head: true          # model-order classification head (Block D)

loss:
  param: 1.0                # lambda_1: Hungarian-aligned parameter MSE
  nll: 1.0                  # lambda_2: label-invariant negative log-likelihood
  resp: 0.5                 # lambda_3a: responsibility cross-entropy supervision
  load_balance: 0.01        # lambda_3b: Switch-style expert load balancing
  g: 1.0                    # lambda_3c: model-order cross-entropy (if use_g_head)

training:
  batch_size: 64            # datasets per step
  steps: 20000
  lr: 0.001                 # AdamW peak
  min_lr: 0.00001           # cosine schedule floor
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  val_every: 500
  val_batches: 8
  patience: 10              # early stopping on validation NLL
  out_dir: runs/default
