# Study 2 -- factorial simulation study (RESEARCH_METHODOLOGY.md section 6.2).
# Randomized theta per replication within each cell (no anecdotal fixed theta).
study: factorial
seed: 31337
reps_per_cell: 500
grid:
  g: [2, 3, 4]
  k: [1, 2, 3, 5]
  n: [50, 100, 250, 500, 1000, 5000]
  overlap: [low, medium, high]        # Bayes-error bins, see default.yaml overlap_bins
  shape_regime: [mixed, large, small] # mixed alpha | all alpha>=1 | includes alpha<1
simulation:
  alpha_range: [0.1, 30.0]
  beta_range: [0.1, 30.0]
  dirichlet_concentration: 1.0
methods: [wh_mclust, ecm, mle, mom]
out_dir: results/study2
