# E2 headline: risk vs n (amortised / hybrid / EM / MLE)
# generated by configs/make_configs.py
experiment: benchmark
family: {name: gamma, k: 1}
simulator: {scale_augment: true}
seed: 1
workers: 8
reps_per_shard: 25
grid:
  g: [2, 3]
  n: [30, 100, 300, 1000, 3000, 10000]
  overlap: [medium, high]
reps: 300
reference: aem+hybrid
methods:
- {type: neural, name: aem, checkpoint: runs/gamma_k1/best.pt}
- {type: neural, name: aem, checkpoint: runs/gamma_k1/best.pt, mode: hybrid}
- {type: neural, name: aem_conv, checkpoint: runs/gamma_k1/best.pt, mode: hybrid,
  max_em_steps: 1000}
- {type: em, n_init: 10, max_iter: 1000}
- {type: batched_em, n_restarts: 10}
- {type: mle, n_restarts: 10}
out: results/e2_n_regime_gamma_k1
