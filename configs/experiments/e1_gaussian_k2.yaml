# E1 comparison family (vs TGMM, EM, VB)
# generated by configs/make_configs.py
experiment: benchmark
family: {name: gaussian, k: 2}
simulator: {scale_augment: true}
seed: 0
workers: 8
reps_per_shard: 25
grid:
  g: [2, 3, 4]
  n: [100, 1000, 10000]
  overlap: [low, medium, high]
reps: 300
reference: aem
methods:
- {type: neural, name: aem, checkpoint: runs/gaussian_k2/best.pt}
- {type: neural, name: aem, checkpoint: runs/gaussian_k2/best.pt, mode: hybrid}
- {type: em, n_init: 10}
- {type: vb}
- {type: tgmm}
out: results/e1_gaussian_k2
