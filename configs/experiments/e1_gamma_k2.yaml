# E1 synthetic benchmark, gamma k=2
# generated by configs/make_configs.py
experiment: benchmark
family: {name: gamma, k: 2}
simulator: {scale_augment: true}
seed: 0
workers: 8
reps_per_shard: 25
grid:
  g: [2, 3, 4, 6]
  n: [30, 100, 300, 1000, 3000, 10000]
  overlap: [low, medium, high]
  shape_regime: [null, small]
reps: 500
known_g: true
n_test: 5000
reference: aem
test_metrics: [quotient_risk, heldout_loglik]
methods:
- {type: neural, name: aem, checkpoint: runs/gamma_k2/best.pt}
- {type: neural, name: aem, checkpoint: runs/gamma_k2/best.pt, mode: hybrid}
- {type: neural, name: nbe_deepsets, checkpoint: runs/baselines/nbe_deepsets_gamma_k2/best.pt}
- {type: neural, name: set_transformer, checkpoint: runs/baselines/set_transformer_gamma_k2/best.pt}
- {type: neural, name: npe_sorted, checkpoint: runs/baselines/npe_sorted_gamma_k2/best.pt}
- {type: neural, name: v1style, checkpoint: runs/baselines/v1style_gamma_k2/best.pt}
- {type: em, n_init: 10}
- {type: mle, n_restarts: 10}
- {type: wh_mclust}
out: results/e1_gamma_k2
