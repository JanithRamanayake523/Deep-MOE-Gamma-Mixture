# E3 symmetry study (Thm 2 / Thm 3)
# generated by configs/make_configs.py
experiment: symmetry
family: {name: gamma, k: 1}
simulator: {scale_augment: true}
seed: 2
grid:
  g: [2]
  n: [50, 200, 1000]
  overlap: [low, medium, high]
reps: 100
checkpoints: {quotient: runs/symmetry/e3_quotient_gamma_k1/best.pt, naive: runs/symmetry/e3_naive_gamma_k1/best.pt,
  sorted: runs/symmetry/e3_sorted_gamma_k1/best.pt, none_nll: runs/symmetry/e3_none_nll_gamma_k1/best.pt}
mcmc: {n_iter: 20000, burn_in: 5000, thin: 10}
out: results/e3_symmetry_gamma_k1
