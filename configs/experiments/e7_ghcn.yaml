# E7(a) GHCN-Daily wet-day rainfall, one mixture per station
# generated by configs/make_configs.py
experiment: real_data
family: {name: gamma, k: 1}
seed: 6
data: {kind: ghcn, directory: data/ghcn, min_wet_days: 200, threshold_mm: 1.0}
g: null
test_frac: 0.2
throughput_g: 2
batched_em: {n_restarts: 10}
methods:
- {type: neural, name: aem, checkpoint: runs/gamma_k1/best.pt}
- {type: neural, name: aem, checkpoint: runs/gamma_k1/best.pt, mode: hybrid}
- {type: em, n_init: 10, g_max: 6}
out: results/e7_ghcn
