# E8 ablation grid (materialise with scripts/make_ablations.py)
# generated by configs/make_configs.py
base: configs/train/gamma_k2.yaml
run_root: runs/ablations
variants:
  T0: {model.T: 0}
  T1: {model.T: 1}
  T3: {model.T: 3}
  T8: {model.T: 8}
  untied: {model.tie_iterations: false}
  no_loglik_eblock: {model.use_loglik: false}
  per_slot_experts: {model.shared_expert: false}
  global_pooling: {model.pooling: global}
  no_canonicalization: {model.canonicalize: false}
  no_deep_supervision: {loss.deep_supervision: 0.0}
  no_resp_supervision: {loss.resp: 0.0}
  deepsets_encoder: {model.encoder: deepsets}
  random_seeds: {model.slot_init: random}
  slot_attention: {model.slot_attention: true}
  no_suffstats: {model.use_suffstats: false}
  nll_target: {loss.nll: 1.0}
  mse_naive: {loss.match: naive}
  mse_sorted: {loss.match: sorted}
