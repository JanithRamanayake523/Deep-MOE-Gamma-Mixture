# E6 robustness: shift, contamination, misspecification
# generated by configs/make_configs.py
experiment: robustness
family: {name: gamma, k: 1}
simulator: {scale_augment: true}
seed: 5
reps: 200
n_test: 5000
scenarios:
- {name: in_prior, g: 2, n: 500}
- {name: contaminated_5pct, g: 2, n: 500, contamination: 0.05}
- {name: more_components, g: 6, n: 2000}
- name: weibull_data
  g: 2
  n: 500
  data_family: {name: weibull, k: 1}
- name: wide_shapes
  g: 2
  n: 500
  data_family:
    name: gamma
    k: 1
    alpha_range: [0.05, 200.0]
methods:
- {type: neural, name: aem, checkpoint: runs/gamma_k1/best.pt}
- {type: neural, name: aem, checkpoint: runs/gamma_k1/best.pt, mode: hybrid}
- {type: em, n_init: 10}
out: results/e6_robustness_gamma_k1
