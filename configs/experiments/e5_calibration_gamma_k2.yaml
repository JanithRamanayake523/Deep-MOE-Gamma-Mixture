# E5 calibration of the quotient-space posterior
# generated by configs/make_configs.py
experiment: calibration
family: {name: gamma, k: 2}
simulator: {scale_augment: true}
seed: 4
checkpoint: runs/gamma_k2/best.pt
n_samples: 1000
grid:
  g: [2, 3]
  n: [100, 1000]
  overlap: [low, medium, high]
reps: 200
c2st_reps: 30
mcmc: {n_iter: 20000, burn_in: 5000, thin: 15}
out: results/e5_calibration_gamma_k2
