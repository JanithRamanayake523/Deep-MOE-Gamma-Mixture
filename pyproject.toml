[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aemnet"
version = "0.3.0"
description = "AEM-Net: symmetry-aware amortized EM for mixture models beyond closed-form M-steps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
plots = ["matplotlib>=3.7"]
bayes = ["numpyro>=0.13", "jax>=0.4"]          # NumPyroNUTSBaseline (gold-standard NUTS)
sklearn = ["scikit-learn>=1.3"]                 # VBGaussianBaseline
realdata = ["allensdk", "rasterio"]             # E7 optional loaders

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
